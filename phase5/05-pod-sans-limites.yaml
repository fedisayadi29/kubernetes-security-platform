apiVersion: v1
kind: Pod
metadata:
  name: pod-sans-limites
  namespace: demo-app
  labels: { app: test-sans-limites, owner: fedi-sayadi, environment: dev }
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      securityContext: { runAsNonRoot: true, runAsUser: 101, readOnlyRootFilesystem: true }
      livenessProbe: { httpGet: { path: /, port: 80 } }
      readinessProbe: { httpGet: { path: /, port: 80 } }
      volumeMounts:
        - name: cache-volume
          mountPath: /var/cache/nginx
        - name: run-volume
          mountPath: /var/run
  volumes:
    - name: cache-volume
      emptyDir: {}
    - name: run-volume
      emptyDir: {}

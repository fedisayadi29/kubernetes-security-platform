apiVersion: v1
kind: Pod
metadata:
  name: pod-conforme
  namespace: demo-app
  labels: { app: test-conforme, owner: fedi-sayadi, environment: dev }
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports: [{ containerPort: 80 }]
      securityContext: { runAsNonRoot: true, runAsUser: 101, privileged: false, readOnlyRootFilesystem: true }
      resources: { requests: { cpu: "100m", memory: "64Mi" }, limits: { cpu: "250m", memory: "128Mi" } }
      livenessProbe: { httpGet: { path: /, port: 80 } }
      readinessProbe: { httpGet: { path: /, port: 80 } }
      volumeMounts:
        - name: cache-volume
          mountPath: /var/cache/nginx
        - name: run-volume
          mountPath: /var/run
  volumes:
    - name: cache-volume
      emptyDir: {}
    - name: run-volume
      emptyDir: {}

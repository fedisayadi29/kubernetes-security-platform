apiVersion: v1
kind: Pod
metadata:
  name: pod-sans-probes
  namespace: demo-app
  labels: { app: test-sans-probes, owner: fedi-sayadi, environment: dev }
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      securityContext: { runAsNonRoot: true, runAsUser: 101, readOnlyRootFilesystem: true }
      resources: { requests: { cpu: "100m", memory: "64Mi" }, limits: { cpu: "250m", memory: "128Mi" } }

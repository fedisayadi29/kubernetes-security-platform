apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-default-limitrange
spec:
  generateExisting: true
  rules:
    - name: gen-limitrange
      match:
        any:
        - resources:
            kinds: [Namespace]
      exclude:
        any:
        - resources:
            namespaces: [kube-system, kyverno, kube-node-lease, kube-public, default, security-tools]
      generate:
        apiVersion: v1
        kind: LimitRange
        name: default-limitrange
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        data:
          spec:
            limits:
              - default:
                  cpu: "250m"
                  memory: "128Mi"
                defaultRequest:
                  cpu: "100m"
                  memory: "64Mi"
                type: Container

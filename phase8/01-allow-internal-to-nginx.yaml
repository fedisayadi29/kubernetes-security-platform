apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-to-nginx
  namespace: demo-app
spec:
  podSelector:
    matchLabels: { app: nginx-demo }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: {} }]
      ports: [{ protocol: TCP, port: 80 }]
